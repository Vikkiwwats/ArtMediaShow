<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive layout check</title>
<style>*{box-sizing:border-box}body{margin:0;background:#202020;color:#fff;font:14px system-ui;padding:18px}header{display:flex;align-items:center;gap:18px;margin:0 0 14px}h1{font-size:16px;margin:0}label{display:flex;gap:8px;align-items:center}select,button{padding:8px;font:inherit}main{display:flex;align-items:flex-start;gap:18px}section{flex:none}p{margin:0 0 10px;color:#ddd}iframe{display:block;height:844px;border:0;background:#000;outline:1px solid #555}#phone320{width:320px}#phone390{width:390px}#phone430{width:430px}</style></head>
<body><header><h1>Проверка узких экранов</h1><label>Раздел <select id="section"><option value="hero">Главная</option><option value="about">О компании</option><option value="services">Услуги</option><option value="equipment">Оборудование</option><option value="process">Как мы работаем</option><option value="projects">Проекты</option><option value="clients">Клиенты</option><option value="contact">Контакты</option></select></label><button id="open">Открыть раздел</button></header>
<main><section><p>320 px</p><iframe id="phone320" title="Экран 320 пикселей" src="./index.html?responsive=41ce3c04#hero"></iframe></section><section><p>390 px</p><iframe id="phone390" title="Экран 390 пикселей" src="./index.html?responsive=41ce3c04#hero"></iframe></section><section><p>430 px</p><iframe id="phone430" title="Экран 430 пикселей" src="./index.html?responsive=41ce3c04#hero"></iframe></section></main>
<script>document.getElementById('open').addEventListener('click',()=>{const id=document.getElementById('section').value;document.querySelectorAll('iframe').forEach(f=>{f.src='./index.html?responsive=41ce3c04#'+id})});</script></body></html>
